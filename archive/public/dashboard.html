<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Perfinted</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <div class="logo">Perfinted.</div>
            </div>

            <nav>
                <div class="nav-item active">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                    Marks Entry
                </div>
                <div class="nav-item">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                    Students
                </div>
                <div class="nav-item">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="20" x2="18" y2="10"></line>
                        <line x1="12" y1="20" x2="12" y2="4"></line>
                        <line x1="6" y1="20" x2="6" y2="14"></line>
                    </svg>
                    Analytics
                </div>
                <div class="nav-item" style="margin-top: auto;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    Logout
                </div>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header-bar">
                <div class="page-title">
                    <h1>Marks Management</h1>
                    <p>Enter new student marks and generate result sheets.</p>
                </div>
                <div class="user-profile">
                    <div style="width: 40px; height: 40px; background: var(--gradient-main); border-radius: 50%;"></div>
                </div>
            </header>

            <!-- Marks Entry Form -->
            <section class="glass-card">
                <h3 style="margin-bottom: 1.5rem; font-weight: 500;">Add New Result</h3>
                <form id="marksForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Student Name</label>
                            <input type="text" id="studentName" placeholder="John Doe" required>
                        </div>
                        <div class="form-group">
                            <label>Student ID</label>
                            <input type="text" id="studentId" placeholder="PF-001" required>
                        </div>
                        <div class="form-group">
                            <label>Mathematics</label>
                            <input type="number" id="mathMarks" min="0" max="100" placeholder="0-100" required>
                        </div>
                        <div class="form-group">
                            <label>Science</label>
                            <input type="number" id="scienceMarks" min="0" max="100" placeholder="0-100" required>
                        </div>
                        <div class="form-group">
                            <label>English</label>
                            <input type="number" id="englishMarks" min="0" max="100" placeholder="0-100" required>
                        </div>
                    </div>
                    <div style="text-align: right;">
                        <button type="submit" class="btn btn-primary">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                            Save & Calculate
                        </button>
                    </div>
                </form>
            </section>

            <!-- Results Table -->
            <section class="glass-card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <h3 style="font-weight: 500;">Recent Results</h3>
                    <input type="text" placeholder="Search student..."
                        style="background: rgba(15,23,42,0.6); border: 1px solid var(--glass-border); padding: 0.5rem 1rem; border-radius: 20px; color: white; width: 250px;">
                </div>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Math</th>
                                <th>Science</th>
                                <th>English</th>
                                <th>Total</th>
                                <th>Average</th>
                                <th>Grade</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="resultsBody">
                            <!-- Rows will be added here by JS -->
                        </tbody>
                    </table>
                    <div id="emptyState" style="text-align: center; padding: 2rem; color: var(--text-muted);">
                        No results added yet. Start by filling out the form above.
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>

</html>
