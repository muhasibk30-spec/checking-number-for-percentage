<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Perfinted</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="admin.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="auth-page">
        <div class="auth-bg-glow"></div>
        <div class="auth-bg-glow-2"></div>

        <div class="auth-card">
            <div class="auth-logo">Perfinted.</div>
            <h2 class="auth-title">Admin Portal</h2>
            <p class="auth-subtitle">Sign in to manage your school.</p>

            <div id="authError" class="auth-error" style="display:none;"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" placeholder="admin" autocomplete="username" required>
                </div>
                <div class="form-group" style="margin-top:1.2rem;">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"
                        required>
                </div>
                <button type="submit" class="btn btn-primary" id="loginBtn" style="width:100%; margin-top:2rem;">
                    Sign In
                </button>
            </form>

            <p style="margin-top:1.5rem; color: var(--text-muted); font-size:0.85rem; text-align:center;">
                Default: <code style="color:var(--primary)">admin</code> / <code
                    style="color:var(--primary)">Khan123</code>
            </p>

            <p style="margin-top:0.8rem; text-align:center;">
                <button onclick="toggleForgot()"
                    style="background:none; border:none; color:var(--primary); cursor:pointer; font-size:0.85rem; text-decoration:underline;">
                    Forgot Password?
                </button>
            </p>

            <!-- Forgot / Reset Password Form -->
            <div id="forgotSection"
                style="display:none; margin-top:1.5rem; border-top:1px solid rgba(255,255,255,0.08); padding-top:1.5rem;">
                <p style="color:var(--text-muted); font-size:0.85rem; margin-bottom:1rem;">
                    Enter your username, reset key, and optional new password. If blank, password resets to <code
                        style="color:var(--primary)">Khan123</code>.
                </p>
                <div class="form-group" style="margin-bottom:0.8rem;">
                    <label>Admin Username</label>
                    <input type="text" id="resetUsername" placeholder="admin">
                </div>
                <div class="form-group" style="margin-bottom:0.8rem;">
                    <label>Reset Key <span style="color:var(--text-muted); font-size:0.8rem;">(default:
                            perfinted_reset)</span></label>
                    <input type="password" id="resetKey" placeholder="perfinted_reset">
                </div>
                <div class="form-group" style="margin-bottom:1rem;">
                    <label>New Password <span style="color:var(--text-muted); font-size:0.8rem;">(optional, min 6 chars)</span></label>
                    <input type="password" id="resetNewPassword" placeholder="Enter new password (or leave blank for Khan123)">
                </div>
                <div id="resetError" class="auth-error" style="display:none; margin-bottom:0.8rem;"></div>
                <div id="resetSuccess"
                    style="display:none; color:#4ade80; background:rgba(74,222,128,0.1); padding:0.75rem 1rem; border-radius:8px; margin-bottom:0.8rem; font-size:0.9rem;">
                </div>
                <button class="btn btn-outline" style="width:100%;" onclick="doResetPassword()">Reset Password</button>
            </div>
        </div>
    </div>

    <script>
        fetch('/api/auth/me', { credentials: 'include' }).then(r => {
            if (r.ok) window.location.href = '/admin/index.html';
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errDiv = document.getElementById('authError');
            btn.disabled = true;
            btn.textContent = 'Signing in...';
            errDiv.style.display = 'none';

            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({
                    username: document.getElementById('username').value,
                    password: document.getElementById('password').value
                })
            });

            if (res.ok) {
                window.location.href = '/admin/index.html';
            } else {
                const data = await res.json();
                errDiv.textContent = data.error || 'Login failed.';
                errDiv.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        });

        function toggleForgot() {
            const sec = document.getElementById('forgotSection');
            sec.style.display = sec.style.display === 'none' ? 'block' : 'none';
        }

        async function doResetPassword() {
            const errDiv = document.getElementById('resetError');
            const successDiv = document.getElementById('resetSuccess');
            errDiv.style.display = 'none';
            successDiv.style.display = 'none';
            const username = document.getElementById('resetUsername').value.trim();
            const resetKey = document.getElementById('resetKey').value.trim();
            const newPassword = document.getElementById('resetNewPassword').value.trim();
            if (!username || !resetKey) {
                errDiv.textContent = 'Username and reset key are required.';
                errDiv.style.display = 'block';
                return;
            }
            if (newPassword && newPassword.length < 6) {
                errDiv.textContent = 'New password must be at least 6 characters.';
                errDiv.style.display = 'block';
                return;
            }
            const res = await fetch('/api/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, resetKey, newPassword })
            });
            const data = await res.json();
            if (res.ok) {
                successDiv.textContent = data.message || 'Password reset successfully!';
                successDiv.style.display = 'block';
            } else {
                errDiv.textContent = data.error || 'Reset failed.';
                errDiv.style.display = 'block';
            }
        }
    </script>
</body>

</html>
